# Host Apache vhost — public port 7004 → Docker panel backends 7013 + 7016

<VirtualHost *:7004>

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy balancer://saas-panel>
        BalancerMember http://127.0.0.1:7013 route=panel1
        BalancerMember http://127.0.0.1:7016 route=panel2
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass / balancer://saas-panel/
    ProxyPassReverse / balancer://saas-panel/

    ErrorLog ${APACHE_LOG_DIR}/saas-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/saas-panel-access.log combined
</VirtualHost>

# Single-replica mode (REPLICAS=1):
# ProxyPass / http://127.0.0.1:7013/
# ProxyPassReverse / http://127.0.0.1:7013/
