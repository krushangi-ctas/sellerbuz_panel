<!-- Button -->
<button
  type="button"
  mat-icon-button
  [matMenuTriggerFor]="userActions"
  class="flex items-center justify-center"
>
  <span class="relative flex items-center justify-center">
    @if (showAvatar && user?.avatar) {
      <img class="w-9 h-9 rounded-full object-cover" [src]="user.avatar" />
    }
    @if (!showAvatar || !user?.avatar) {
      <mat-icon
        [svgIcon]="'heroicons_solid:user-circle'"
        class="text-primary icon-size-8"
        style="width: 32px; height: 32px"
      ></mat-icon>
    }
    <span
      class="absolute right-0 bottom-0 w-2.5 h-2.5 rounded-full ring-2 ring-white dark:ring-gray-800"
      [ngClass]="{
        'bg-green-500': user?.status === 'online',
        'bg-amber-500': user?.status === 'away',
        'bg-red-500': user?.status === 'busy',
        'bg-gray-400': user?.status === 'not-visible' || !user?.status,
      }"
    ></span>
  </span>
</button>

<mat-menu [xPosition]="'before'" #userActions="matMenu" class="bg-white">
  <button type="button" mat-menu-item>
    <span class="flex flex-col leading-none">
      <span class="">Signed in as</span>
      <span class="mt-1.5 text-md font-medium">{{ user.email }}</span>
    </span>
  </button>
  <mat-divider class="my-2"></mat-divider>
  <button
    type="button"
    mat-menu-item
    (click)="goToProfile()"
    class="hover:bg-gray-100"
  >
    <mat-icon
      [svgIcon]="'heroicons_solid:user-circle'"
      class="text-primary"
    ></mat-icon>
    <span class="">Profile</span>
  </button>
  <mat-divider class="my-2"></mat-divider>
  <button
    type="button"
    mat-menu-item
    (click)="signOut()"
    class="hover:bg-gray-100"
  >
    <mat-icon
      [svgIcon]="'heroicons_solid:logout'"
      class="text-primary"
    ></mat-icon>
    <span class="">Sign out</span>
  </button>
</mat-menu>

<mat-menu class="user-status-menu" #userStatus="matMenu">
  <button type="button" mat-menu-item (click)="updateUserStatus('online')">
    <span class="w-4 h-4 mr-3 rounded-full bg-emerald-500"></span>
    <span>Online</span>
  </button>
  <button type="button" mat-menu-item (click)="updateUserStatus('away')">
    <span class="w-4 h-4 mr-3 rounded-full bg-amber-500"></span>
    <span>Away</span>
  </button>
  <button type="button" mat-menu-item (click)="updateUserStatus('busy')">
    <span class="w-4 h-4 mr-3 rounded-full bg-red-500"></span>
    <span>Busy</span>
  </button>
  <button type="button" mat-menu-item (click)="updateUserStatus('not-visible')">
    <span class="w-4 h-4 mr-3 rounded-full bg-gray-400"></span>
    <span>Invisible</span>
  </button>
</mat-menu>
