<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
@if (isScreenSmall) {
  <fuse-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    [mode]="'over'"
    [name]="'mainNavigation'"
    [navigation]="navigation.default"
    [opened]="false"
  >
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
      <!-- Logo -->
      <!-- <div class="flex items-center h-20 pt-6 px-8">
      <img class="w-24" src="assets/images/logo/logo-dark.svg" alt="Logo image" />
    </div> -->
    </ng-container>
  </fuse-vertical-navigation>
}

<!-- Wrapper -->
<div
  class="flex flex-col flex-auto items-center w-full min-w-0 bg-gray-200 dark:bg-card"
>
  @if (alertMessage) {
    <fuse-alert
      [appearance]="'outline'"
      [dismissible]="true"
      [dismissed]="true"
      [name]="'alert_success'"
      [type]="'success'"
    >
      <span fuseAlertTitle>Success</span>
      {{ alertMessage }}
    </fuse-alert>
  }

  <fuse-alert
    [appearance]="'outline'"
    [dismissible]="true"
    [dismissed]="true"
    [name]="'alert_error'"
    [type]="'error'"
  >
    <span fuseAlertTitle>Error</span>
    {{ alertMessage }}
  </fuse-alert>
  <!-- Header -->
  <div
    class="relative flex justify-center w-full overflow-hidden z-49 bg-primary-700 print:hidden"
  >
    <div
      class="max-w-360 w-full sm:py-3 sm:m-8 sm:mb-0 md:mt-12 md:mx-8 md:pt-4 md:pb-3 sm:rounded-t-xl border-b sm:shadow-2xl overflow-hidden bg-card"
    >
      <!-- Top bar -->
      <div class="relative flex flex-auto flex-0 items-center h-8 px-4 md:px-6">
        <!-- Logo -->
        @if (!isScreenSmall) {
          <!-- <div class="flex items-center mx-2 w-50"> -->
          <!-- Light version -->
          <!-- <img class="w-full dark:hidden" src="assets/images/logo/logo-dark.svg" alt="Logo image" /> -->
          <!-- Dark version -->
          <!-- <img class="hidden dark:flex w-full" src="assets/icons/footer-logo.svg" alt="Logo image" /> -->
          <!-- </div> -->
        }
        <!-- Navigation toggle button -->
        @if (isScreenSmall) {
          <button
            type="button"
            mat-icon-button
            (click)="toggleNavigation('mainNavigation')"
          >
            <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
          </button>
        }
        <!-- Components -->
        <div
          class="flex items-center pl-2 pr-7 sm:pr-8 ml-auto space-x-1 sm:space-x-2 shrink-0 flex-shrink-0 z-10"
        >
          <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
          <user></user>
        </div>
      </div>
      <!-- Bottom bar -->
      @if (!isScreenSmall) {
        <div class="relative flex flex-auto flex-0 items-center h-16 px-4">
          <fuse-horizontal-navigation
            [name]="'mainNavigation'"
            [navigation]="navigation.horizontal"
          >
          </fuse-horizontal-navigation>
        </div>
      }
    </div>
  </div>

  <!-- Content -->
  <div class="flex flex-auto justify-center w-full sm:px-8">
    <div
      class="flex flex-col flex-auto w-full sm:max-w-360 sm:shadow-xl sm:overflow-hidden bg-default"
    >
      <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
    Otherwise, layout changes won't be registered and the view won't be updated! -->
      @if (true) {
        <router-outlet></router-outlet>
      }
    </div>
  </div>

  <!-- Footer -->
  <!-- <div class="relative flex justify-center w-full z-49 print:hidden">
<div
  class="flex items-center max-w-360 w-full h-14 sm:h-20 px-6 md:px-8 sm:shadow-xl border-t bg-card dark:bg-default">
  <span class="font-medium text-secondary">{{ currentYear }} &copy; Myboeken.nl. All rights
  reserved.</span>
</div>
</div> -->
</div>
