<!-- Navigation -->
@if (isScreenSmall) {
  <fuse-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    [mode]="'over'"
    [name]="'mainNavigation'"
    [navigation]="navigation.default"
    [opened]="false"
  >
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
      <!-- Logo -->
      <!-- <div class="flex items-center h-20 pt-6 px-8">
      <img class="w-24" src="assets/images/logo/logo-text-on-dark.svg" alt="Logo image" />
    </div> -->
    </ng-container>
  </fuse-vertical-navigation>
}

<!-- Wrapper -->
<div class="modern-layout flex flex-col flex-auto w-full min-w-0 bg-default">
  @if (alertMessage) {
    <fuse-alert
      [appearance]="'outline'"
      [dismissible]="true"
      [dismissed]="true"
      [name]="'alert_success'"
      [type]="'success'"
    >
      <span fuseAlertTitle>Success</span>
      {{ alertMessage }}
    </fuse-alert>
  }

  <fuse-alert
    [appearance]="'outline'"
    [dismissible]="true"
    [dismissed]="true"
    [name]="'alert_error'"
    [type]="'error'"
  >
    <span fuseAlertTitle>Error</span>
    {{ alertMessage }}
  </fuse-alert>
  <!-- Header -->
  <div
    class="modern-layout__header bg-card border-b dark:bg-transparent sticky top-0 flex flex-0 items-center w-full min-h-14 z-49 print:hidden"
  >
    @if (!isScreenSmall) {
      <!-- Horizontal navigation -->
      <fuse-horizontal-navigation
        class="modern-layout__nav mr-4 flex-1 min-w-0"
        [name]="'mainNavigation'"
        [navigation]="navigation.horizontal"
      >
      </fuse-horizontal-navigation>
    }
    <!-- Navigation toggle button -->
    @if (isScreenSmall) {
      <button
        type="button"
        mat-icon-button
        (click)="toggleNavigation('mainNavigation')"
      >
        <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
      </button>
    }
    <!-- Components -->
    <div
      class="flex items-center ml-auto pl-2 pr-7 sm:pr-8 gap-2 sm:gap-3 shrink-0 flex-shrink-0 z-10"
    >
      <!-- Top right Marketplace dropdown commented out - Marketplace tabs now displayed on Inventory header -->

      <fuse-fullscreen
        class="hidden md:inline-flex items-center justify-center"
      ></fuse-fullscreen>
      <messages class="inline-flex items-center justify-center"></messages>

        class="inline-flex items-center justify-center"

      ></user>

  </div>

  <!-- Content -->
  <div class="flex flex-col flex-auto w-full">
    <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
    Otherwise, layout changes won't be registered and the view won't be updated! -->
    @if (true) {
      <router-outlet></router-outlet>
    }
