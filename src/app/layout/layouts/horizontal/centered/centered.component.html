<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<div
  class="flex flex-auto justify-center w-full sm:p-4 md:p-8 bg-gray-200 dark:bg-card"
>
  <!-- Navigation -->
  @if (isScreenSmall) {
    <fuse-vertical-navigation
      class="dark bg-gray-900 print:hidden"
      [mode]="'over'"
      [name]="'mainNavigation'"
      [navigation]="navigation.default"
      [opened]="false"
    >
      <!-- Navigation header hook -->
      <ng-container fuseVerticalNavigationContentHeader>
        <!-- Logo -->
        <div class="flex items-center h-20 pt-6 px-8">
          <img class="w-30" src="assets/images/logo/logo-text-on-dark.svg" />
        </div>
      </ng-container>
    </fuse-vertical-navigation>
  }

  <!-- Wrapper -->
  <div
    class="flex flex-col items-center flex-auto min-w-0 max-w-360 sm:rounded-xl shadow-2xl dark:shadow-none overflow-hidden"
  >
    <!-- Header -->
    <div
      class="relative flex flex-0 items-center w-full h-16 sm:h-20 px-4 md:px-6 z-49 bg-card border-b dark:bg-default print:hidden"
    >
      @if (!isScreenSmall) {
        <!-- Logo -->
        <!-- <div class="flex items-center mx-2 lg:mr-8"> -->
        <!-- <div class="hidden w-40 h-20 lg:flex"> -->
        <!-- Light version -->
        <!-- <img class="dark:hidden w-full" src="assets/images/logo/logo-dark.svg" alt="Logo image" /> -->
        <!-- Dark version -->
        <!-- <img class="hidden dark:flex w-full" src="assets/icons/footer-logo.svg" alt="Logo image" /> -->
        <!-- </div> -->
        <!-- Small version -->
        <!-- <img class="flex lg:hidden w-10" src="assets/images/logo/mb-logo.ico" alt="Logo image" /> -->
        <!-- </div> -->
        <!-- Horizontal navigation -->
        <fuse-horizontal-navigation
          class="mr-2 min-w-0 flex-1"
          [name]="'mainNavigation'"
          [navigation]="navigation.horizontal"
        >
        </fuse-horizontal-navigation>
      }
      <!-- Navigation toggle button -->
      @if (isScreenSmall) {
        <button
          type="button"
          class="mr-2"
          mat-icon-button
          (click)="toggleNavigation('mainNavigation')"
        >
          <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
        </button>
      }
      <!-- Components -->
      <div
        class="flex items-center pl-2 pr-7 sm:pr-8 ml-auto space-x-1 sm:space-x-2 shrink-0 flex-shrink-0 z-10"
      >
        <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
        <user></user>
      </div>
    </div>
    @if (alertMessage) {
      <fuse-alert
        [appearance]="'outline'"
        [dismissible]="true"
        [dismissed]="true"
        [name]="'alert_success'"
        [type]="'success'"
      >
        <span fuseAlertTitle>Success</span>
        {{ alertMessage }}
      </fuse-alert>
    }

    <fuse-alert
      [appearance]="'outline'"
      [dismissible]="true"
      [dismissed]="true"
      [name]="'alert_error'"
      [type]="'error'"
    >
      <span fuseAlertTitle>Error</span>
      {{ alertMessage }}
    </fuse-alert>
    <!-- Content -->
    <div class="flex flex-col flex-auto w-full bg-default">
      <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
  Otherwise, layout changes won't be registered and the view won't be updated! -->
      @if (true) {
        <router-outlet></router-outlet>
      }
    </div>

    <!-- Footer -->
    <!-- <div
class="relative flex flex-0 items-center justify-start w-full h-16 sm:h-20 px-6 sm:px-8 z-49 bg-card border-t dark:bg-default print:hidden">
<span class="font-medium text-secondary">{{ currentYear }} &copy; Myboeken.nl. All rights
reserved.</span>
</div> -->
  </div>
</div>
