<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
@if (isScreenSmall) {
  <fuse-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    [mode]="'over'"
    [name]="'mainNavigation'"
    [navigation]="navigation.default"
    [opened]="false"
  >
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
      <!-- Logo -->
      <!-- <div class="flex items-center h-20 pt-6 px-8">
      <img class="w-full" src="assets/icons/footer-logo.svg" alt="Logo image" />
    </div> -->
    </ng-container>
  </fuse-vertical-navigation>
}

<!-- Wrapper -->
<div
  class="flex flex-col flex-auto items-center w-full min-w-0 bg-gray-200 dark:bg-card"
>
  <!-- Header -->
  <div
    class="relative flex flex-col flex-0 justify-center w-full h-16 sm:h-20 md:h-36 overflow-hidden z-49 shadow dark:shadow-none print:hidden"
  >
    @if (alertMessage) {
      <fuse-alert
        [appearance]="'outline'"
        [dismissible]="true"
        [dismissed]="true"
        [name]="'alert_success'"
        [type]="'success'"
      >
        <span fuseAlertTitle>Success</span>
        {{ alertMessage }}
      </fuse-alert>
    }

    <fuse-alert
      [appearance]="'outline'"
      [dismissible]="true"
      [dismissed]="true"
      [name]="'alert_error'"
      [type]="'error'"
    >
      <span fuseAlertTitle>Error</span>
      {{ alertMessage }}
    </fuse-alert>
    <!-- Top bar -->
    <div
      class="relative dark flex flex-auto justify-center w-full px-4 md:px-8 bg-gray-800 dark:bg-gray-900"
    >
      <div class="flex items-center w-full max-w-360 h-8 sm:h-10">
        <!-- Logo -->
        @if (!isScreenSmall) {
          <!-- <div class="flex items-center h-full w-40">
          <img class="w-full" src="assets/icons/footer-logo.svg" alt="Logo image" />
        </div> -->
        }
        <!-- Navigation toggle button -->
        @if (isScreenSmall) {
          <button
            type="button"
            mat-icon-button
            (click)="toggleNavigation('mainNavigation')"
          >
            <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
          </button>
        }
        <!-- Components -->
        <div
          class="flex items-center pl-2 pr-7 sm:pr-8 space-x-0.5 sm:space-x-2 shrink-0 flex-shrink-0 z-10"
        >
          <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
          <user></user>
        </div>
      </div>
    </div>
    <!-- Bottom bar -->
    @if (!isScreenSmall) {
      <div
        class="flex flex-auto justify-center px-4 md:px-8 bg-card dark:bg-gray-700"
      >
        <div class="relative flex items-center w-full max-w-360 h-16">
          <fuse-horizontal-navigation
            class="-mx-4"
            [name]="'mainNavigation'"
            [navigation]="navigation.horizontal"
          ></fuse-horizontal-navigation>
        </div>
      </div>
    }
  </div>

  <!-- Content -->
  <div class="flex flex-auto justify-center w-full sm:p-6 md:p-8">
    <div
      class="flex flex-col flex-auto w-full sm:max-w-360 sm:shadow-lg sm:rounded-lg sm:overflow-hidden bg-default"
    >
      <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
    Otherwise, layout changes won't be registered and the view won't be updated! -->
      @if (true) {
        <router-outlet></router-outlet>
      }
    </div>
  </div>

  <!-- Footer -->
  <!-- <div class="relative flex flex-0 justify-center w-full px-6 md:px-8 z-49 border-t bg-card print:hidden">
<div class="flex items-center w-full max-w-360 h-14 sm:h-20">
  <span class="font-medium text-secondary">{{ currentYear }} &copy; Myboeken.nl. All rights
  reserved.</span>
</div>
</div> -->
</div>
