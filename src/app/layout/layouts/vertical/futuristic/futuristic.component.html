<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation
  class="dark bg-indigo-800 text-white print:hidden"
  [mode]="isScreenSmall ? 'over' : 'side'"
  [name]="'mainNavigation'"
  [navigation]="navigation.futuristic"
  [opened]="!isScreenSmall"
>
  <!-- Navigation header hook -->
  <ng-container fuseVerticalNavigationHeader>
    <!-- Logo -->
    <div class="flex items-center w-full h-4 p-6 pb-0">
      <!-- <img class="w-full" src="assets/icons/footer-logo.svg" /> -->
    </div>
  </ng-container>
  <!-- Navigation footer hook -->
  <ng-container fuseVerticalNavigationFooter>
    <!-- User -->
    <div class="flex items-center w-full px-6 py-8 border-t">
      <user></user>
      <div class="flex flex-col w-full ml-4 overflow-hidden">
        <div
          class="w-full whitespace-nowrap text-ellipsis overflow-hidden leading-normal text-current opacity-80"
        >
          {{ user.first_name + " " + user.last_name }}
        </div>
        <div
          class="w-full mt-0.5 whitespace-nowrap text-sm text-ellipsis overflow-hidden leading-normal text-current opacity-50"
        >
          {{ user.email }}
        </div>
      </div>
    </div>
  </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0">
  @if (alertMessage) {
    <fuse-alert
      [appearance]="'outline'"
      [dismissible]="true"
      [dismissed]="true"
      [name]="'alert_success'"
      [type]="'success'"
    >
      <span fuseAlertTitle>Success</span>
      {{ alertMessage }}
    </fuse-alert>
  }

  <fuse-alert
    [appearance]="'outline'"
    [dismissible]="true"
    [dismissed]="true"
    [name]="'alert_error'"
    [type]="'error'"
  >
    <span fuseAlertTitle>Error</span>
    {{ alertMessage }}
  </fuse-alert>
  <!-- Header -->
  <div
    class="relative flex flex-0 items-center w-full h-6 px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden"
  >
    <!-- Navigation toggle button -->
    <div class="custom-css h-fit">
      <button
        type="button"
        class="mr-2"
        mat-icon-button
        (click)="toggleNavigation('mainNavigation')"
      >
        <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
      </button>
    </div>
    <!-- Components -->
    <div class="pl-2 space-x-0.5 sm:space-x-2 h-fit">
      <fuse-fullscreen class="hidden md:block custom-css"></fuse-fullscreen>
    </div>
  </div>

  <!-- Content -->
  <div class="flex flex-col flex-auto">
    <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
    Otherwise, layout changes won't be registered and the view won't be updated! -->
    @if (true) {
      <router-outlet></router-outlet>
    }
  </div>

  <!-- Footer -->
  <!-- <div
  class="relative flex flex-0 items-center justify-start w-full h-14 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden">
  <span class="font-medium text-secondary">{{ currentYear }} &copy; Myboeken.nl. All rights
  reserved.</span>
</div> -->
</div>
