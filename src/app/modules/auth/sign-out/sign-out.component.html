<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0">
  <div
    class="w-full sm:w-auto py-8 px-4 sm:p-12 sm:rounded-2xl sm:shadow sm:bg-card"
  >
    <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">
      <!-- Logo -->
      <div class="w-full flex justify-center mx-auto">
        <a routerLink="/" class="flex items-center gap-1 group shrink-0">
          <img
            src="assets/ctasis-logo.png"
            alt="SellerBuz"
            class="h-10 w-auto object-contain"
          />
          <span
            class="text-[1.8rem] font-bold tracking-tight font-outfit bg-gradient-to-r from-[#3C9AC4] to-[#13355A] bg-clip-text text-transparent"
          >
            SellerBuz
          </span>
        </a>
      </div>

      <!-- Title -->
      <div
        class="mt-8 text-4xl font-extrabold tracking-tight leading-tight text-center"
      >
        You have signed out!
      </div>
      <div class="flex justify-center mt-0.5 font-medium">
        <!-- Redirect countdown -->
        @if (countdown > 0) {
          Redirecting in {{ countdown | i18nPlural: countdownMapping }}
        }

        <!-- Redirect message -->
        @if (countdown === 0) {
          You are now being redirected!
        }
      </div>

      <!-- Form footer -->
      <div class="mt-8 text-md font-medium text-secondary text-center">
        <span>Go to</span>
        <a
          class="ml-1 text-primary-600 hover:underline"
          [routerLink]="['/sign-in']"
          >sign in
        </a>
      </div>
    </div>
  </div>
</div>
