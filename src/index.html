<!doctype html>
<html lang="en">
  <head>
    <title>Ctas Sellerbuz</title>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="Admin Template and Starter Kit with Angular, Angular Material Components and TailwindCSS"
    />
    <meta name="keywords" content="Ctas Sellerbuz" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
    />

    <base href="/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/ctas-logo.png" />
    <!-- Fonts -->
    <link href="assets/fonts/inter/inter.css" rel="stylesheet" />

    <link href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Icon fonts -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Splash screen styles -->
    <link href="assets/styles/splash-screen.css" rel="stylesheet" />

    <!-- ReDoc OpenAPI Documentation Script -->
    <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js"></script>
  </head>

  <body>
    <!-- Splash screen -->
    <fuse-splash-screen
      class="fixed inset-0 bg-gradient-to-br from-slate-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 z-[999999]"
    >
      <div class="flex flex-col items-center justify-center w-full h-full">
        <div class="flex items-center gap-1 mb-4">
          <img
            src="assets/ctasis-logo.png"
            alt="SellerBuz"
            class="h-10 w-auto object-contain"
          />
          <span
            class="text-[1.8rem] font-bold tracking-tight font-outfit bg-gradient-to-r from-[#3C9AC4] to-[#13355A] bg-clip-text text-transparent"
          >
            SellerBuz
          </span>
        </div>
        <div class="flex flex-col items-center">
          <div
            class="w-60 h-1 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden"
          >
            <div class="splash-loader-bar h-full bg-primary rounded-full"></div>
          </div>
          <p
            class="text-xs font-semibold text-primary/80 tracking-wide uppercase mt-3"
          >
            Loading
          </p>
        </div>
      </div>
    </fuse-splash-screen>

    <!-- App root -->
    <app-root></app-root>
  </body>
</html>
