name: saas-panel

x-panel-base: &panel-base
    build: .
    image: saas-panel:${IMAGE_TAG:-latest}
    env_file:
        - .env
    restart: unless-stopped
    networks:
        - saas-shared
    deploy:
        resources:
            limits:
                memory: ${MEMORY_LIMIT:-8G}
            reservations:
                memory: ${MEMORY_RESERVATION:-512M}
    # healthcheck:
    #     test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
    #     interval: 30s
    #     timeout: 5s
    #     retries: 3
    #     start_period: 10s

services:
    panel:
        <<: *panel-base
        ports:
            - "${HOST_PORT:-7013}:80"

    panel-replica:
        <<: *panel-base
        profiles:
            - replica
        ports:
            - "${REPLICA_PORT:-7016}:80"

    dev:
        profiles:
            - dev
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: saas-panel-dev
        ports:
            - "4200:4200"
        volumes:
            - .:/app
            - /app/node_modules
        command: ng serve --host 0.0.0.0 --poll=2000

networks:
    saas-shared:
        external: true
        name: saas-shared-network
